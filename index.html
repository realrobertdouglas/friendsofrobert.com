<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends of Robert</title>
  <meta name="description" content="Friends of Robert">
  <style>
    :root { --bg:#fbf8f2; --fg:#1d1b17; --muted:#6b665c; --accent:#b4472e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17150f; --fg:#f2eee6; --muted:#a39d91; --accent:#f08a5d; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.6 Georgia, "Times New Roman", serif; }
    main { max-width: 640px; margin: 0 auto; padding: 18vh 16px 10vh; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); line-height:1.1; margin:0 0 .5em; letter-spacing:-.01em; }
    p { margin: 0 0 1em; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    footer { margin-top: 4em; font-size: .9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Friends of Robert</h1>
    <p class="muted">This site is just getting started. Check back soon.</p>
    <footer>&copy; 2026 Friends of Robert</footer>
  </main>
</body>
</html>
