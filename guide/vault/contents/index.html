<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <style>
    :root { --bg:#fbf8f2; --fg:#1d1b17; --muted:#6b665c; --accent:#b4472e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17150f; --fg:#f2eee6; --muted:#a39d91; --accent:#f08a5d; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.6 Georgia, serif; }
    main { max-width: 640px; margin: 0 auto; padding: 14vh 16px 10vh; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); line-height:1.1; margin:0 0 .5em; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Your Name</h1>
    <p class="muted">PLACEHOLDER RELEASE CONTENT. Replace everything in the vault's <code>contents/</code> folder with what should actually be published.</p>
  </main>
</body>
</html>
